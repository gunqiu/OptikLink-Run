name: OptikLink Auto Login

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm install
          npx playwright install chromium --with-deps

      - name: Install & start sing-box
        run: |
          # 下载并安装 sing-box 最新稳定版
          curl -fsSL https://sing-box.app/install.sh | sh
          
          # 安装 Go 环境（用于编译 proxylink）
          sudo apt-get update && sudo apt-get install -y golang-go
          
          # 下载并编译 proxylink（URI 转 sing-box outbound 工具）
          git clone --depth 1 https://github.com/Fanju6/Proxylink.git /tmp/proxylink
          cd /tmp/proxylink/Proxylink
          go build -o /usr/local/bin/proxylink .
          
          # 创建 sing-box 基础配置文件
          cat > /tmp/sing-box.json << 'EOF'
          {
            "log": {
              "level": "warn",
              "timestamp": true
            },
            "inbounds": [
              {
                "type": "mixed",
                "tag": "mixed-in",
                "listen": "127.0.0.1",
                "listen_port": 1080
              }
            ],
            "outbounds": [
              {
                "type": "direct",
                "tag": "direct"
              },
              {
                "type": "block",
                "tag": "block"
              }
            ],
            "route": {
              "final": "direct"
            }
          }
          EOF
          
          # 从 secrets 读取节点分享链接并转换为 sing-box outbound 配置
          # 支持协议：vless / vmess / trojan / tuic / anytls / hysteria2 / socks5 / socks
          # 格式：完整分享链接，如 vless://uuid@server:port?...
          
          NODE_URI="${{ secrets.SINGBOX_NODE_URI }}"
          
          if [ -n "$NODE_URI" ]; then
            echo "Converting URI to sing-box outbound config..."
            
            # 使用 proxylink 将 URI 转换为 sing-box 配置
            proxylink -parse "$NODE_URI" -format singbox -o /tmp/node_outbound.json
            
            # 提取 outbound 配置并合并到主配置
            python3 -c "
import json

with open('/tmp/sing-box.json', 'r') as f:
    config = json.load(f)

with open('/tmp/node_outbound.json', 'r') as f:
    node_config = json.load(f)

# 提取 outbounds 数组中的第一个节点
if 'outbounds' in node_config and len(node_config['outbounds']) > 0:
    outbound = node_config['outbounds'][0]
    # 确保 tag 存在
    if 'tag' not in outbound:
        outbound['tag'] = 'proxy'
    config['outbounds'].insert(0, outbound)
    config['route']['final'] = outbound['tag']
    print(f\"Added outbound: {outbound['tag']} ({outbound.get('type', 'unknown')})\")
else:
    print('ERROR: No valid outbound found in converted config')
    exit(1)

with open('/tmp/sing-box.json', 'w') as f:
    json.dump(config, f, indent=2)
"
          else
            echo "ERROR: SINGBOX_NODE_URI secret is not set"
            exit 1
          fi
          
          # 验证配置
          sing-box check -c /tmp/sing-box.json || exit 1
          
          # 启动 sing-box
          sing-box run -c /tmp/sing-box.json &
          sleep 3
          
          # 测试代理连通性
          curl -s --socks5 127.0.0.1:1080 --connect-timeout 15 https://api.ipify.org || echo "proxy test failed"

      - name: Run login script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT: ${{ secrets.TG_CHAT_ID }},${{ secrets.TG_BOT_TOKEN }}
          PROXY_URL: "socks5://127.0.0.1:1080"
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
