name: OptikLink Auto Login

on:
  schedule:
    - cron: '0 0 */3 * *'
  workflow_dispatch:

jobs:
  renew:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install dependencies
        run: |
          npm ci
          npx playwright install chromium --with-deps

      - name: Install sing-box and proxylink
        run: |
          set -e

          curl -fsSL https://sing-box.app/install.sh | sh

          sudo apt-get update
          sudo apt-get install -y golang-go

          rm -rf /tmp/proxylink
          git clone --depth 1 https://github.com/Fanju6/Proxylink.git /tmp/proxylink
          cd /tmp/proxylink
          go build -o /usr/local/bin/proxylink .

      - name: Build sing-box config
        env:
          NODE_URI: ${{ secrets.SINGBOX_NODE_URI }}
        run: |
          set -e

          if [ -z "$NODE_URI" ]; then
            echo "ERROR: SINGBOX_NODE_URI secret is not set"
            exit 1
          fi

          cat > /tmp/sing-box.json << 'EOF'
          {
            "log": {
              "level": "warn",
              "timestamp": true
            },
            "inbounds": [
              {
                "type": "mixed",
                "tag": "mixed-in",
                "listen": "127.0.0.1",
                "listen_port": 1080
              }
            ],
            "outbounds": [
              {
                "type": "direct",
                "tag": "direct"
              },
              {
                "type": "block",
                "tag": "block"
              }
            ],
            "route": {
              "final": "direct"
            }
          }
          EOF

          proxylink -parse "$NODE_URI" -format singbox -o /tmp/node_outbound.json

          python3 - <<'PY'
          import json, sys

          with open('/tmp/sing-box.json', 'r', encoding='utf-8') as f:
              config = json.load(f)

          with open('/tmp/node_outbound.json', 'r', encoding='utf-8') as f:
              node_config = json.load(f)

          if 'outbounds' not in node_config or not node_config['outbounds']:
              print('ERROR: No valid outbound found in converted config')
              sys.exit(1)

          outbound = node_config['outbounds'][0]
          if 'tag' not in outbound:
              outbound['tag'] = 'proxy'

          config['outbounds'].insert(0, outbound)
          config['route']['final'] = outbound['tag']

          with open('/tmp/sing-box.json', 'w', encoding='utf-8') as f:
              json.dump(config, f, indent=2, ensure_ascii=False)

          print(f"Added outbound: {outbound['tag']} ({outbound.get('type', 'unknown')})")
          PY

      - name: Check sing-box config
        run: |
          set -e
          sing-box check -c /tmp/sing-box.json

      - name: Start sing-box
        run: |
          set -e
          nohup sing-box run -c /tmp/sing-box.json >/tmp/sing-box.log 2>&1 &
          sleep 3
          cat /tmp/sing-box.log || true

      - name: Test proxy
        run: |
          set -e
          curl -s --socks5 127.0.0.1:1080 --connect-timeout 15 https://api.ipify.org || echo "proxy test failed"

      - name: Run login script
        env:
          DISCORD_TOKEN: ${{ secrets.DISCORD_TOKEN }}
          TG_BOT: ${{ secrets.TG_CHAT_ID }},${{ secrets.TG_BOT_TOKEN }}
          PROXY_URL: socks5://127.0.0.1:1080
        run: npx playwright test

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots-${{ github.run_number }}
          path: test-results/
          retention-days: 7
          if-no-files-found: ignore
